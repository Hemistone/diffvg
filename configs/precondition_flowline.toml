# Flowline preset using TEED edge strength.
# Uses argparse dest names (underscores), not CLI flag names.

precondition = true
precond_mode = "flowline"

flow_edge_backend = "teed"
flow_seed_mode = "quantile"
flow_seed_quantile = 0.85
flow_min_strength = 0.2
flow_step_px = 1.0
flow_max_len = 256
flow_min_len = 8
flow_min_seed_dist = 6
flow_curvature_deg = 60.0
flow_field_sigma = 2.0
flow_field_iters = 1
flow_coverage_decay = 0.85
flow_coverage_radius = 2

teed_weights = "weights/teed/5_model.pth"
teed_detect_res = 768
teed_safe_steps = 2

stroke_width_mode = "a4_pen"
pen_width_min_mm = 0.35
pen_width_max_mm = 0.8
