# Shared TEED preset (detail) using quantile thresholding.
# Uses argparse dest names (underscores), not CLI flag names.

precondition = true
precond_mode = "teed"
precond_teed_weights = "weights/teed/5_model.pth"
precond_teed_detect_res = 768
precond_teed_threshold_mode = "quantile"
precond_teed_threshold_quantile = 0.85
precond_teed_safe_steps = 2

precond_min_path_length = 12
precond_max_path_length = 192
precond_min_component_area = 8
precond_morph_open_radius = 1
precond_morph_close_radius = 1
precond_width_mode = "a4_pen"
precond_width_min_mm = 0.35
precond_width_max_mm = 0.8
