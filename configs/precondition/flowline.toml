# Flowline preset using TEED edge strength.
# Uses argparse dest names (underscores), not CLI flag names.

precondition = true
precond_mode = "flowline"

precond_flow_edge_backend = "teed"
precond_flow_seed_mode = "quantile"
precond_flow_seed_quantile = 0.85
precond_flow_min_strength = 0.2
precond_flow_step_px = 1.0
precond_flow_max_len = 256
precond_flow_min_len = 8
precond_flow_min_seed_dist = 6
precond_flow_curvature_deg = 60.0
precond_flow_field_sigma = 2.0
precond_flow_field_iters = 1
precond_flow_coverage_decay = 0.85
precond_flow_coverage_radius = 2

precond_teed_weights = "weights/teed/5_model.pth"
precond_teed_detect_res = 768
precond_teed_safe_steps = 2

precond_width_mode = "a4_pen"
precond_width_min_mm = 0.35
precond_width_max_mm = 0.8
