# Shared lineart preset using quantile thresholding.
# Uses argparse dest names (underscores), not CLI flag names.

precondition = true
precond_mode = "lineart"
precond_lineart_threshold_mode = "quantile"
precond_lineart_threshold_quantile = 0.2 # Higher -> more ink coverage/paths, lower -> sparser strokes

precond_min_path_length = 8
precond_max_path_length = 256
precond_min_component_area = 0
precond_morph_open_radius = 0
precond_morph_close_radius = 0
precond_width_mode = "a4_pen"
precond_width_min_mm = 0.35
precond_width_max_mm = 0.8
