# Precondition-only TEED preset (detail) using quantile thresholding.
# Uses argparse dest names (underscores), not CLI flag names.

edge_backend = "teed"
teed_weights = "weights/teed/5_model.pth"
teed_detect_res = 768
teed_threshold_mode = "quantile"
teed_threshold_quantile = 0.85
teed_safe_steps = 2

min_path_length = 12
max_path_length = 256
min_component_area = 8
morph_open_radius = 1
morph_close_radius = 1
stroke_width_mode = "a4_pen"
pen_width_min_mm = 0.35
pen_width_max_mm = 0.8

fixed_stroke = false
fixed_stroke_alpha = 0.9
