# Painterly TEED preset for more detail (denser edges).
# Uses argparse dest names (underscores), not CLI flag names.

precondition = true
precond_mode = "teed"
teed_weights = "weights/teed/5_model.pth"
teed_detect_res = 768
teed_threshold = 0.22
teed_safe_steps = 2

precond_min_path_length = 12
precond_max_path_length = 192
precond_min_component_area = 8
precond_morph_open_radius = 1
precond_morph_close_radius = 1
stroke_width_mode = "a4_pen"
pen_width_min_mm = 0.35
pen_width_max_mm = 0.8

fixed_stroke = false
fixed_stroke_alpha = 0.9
