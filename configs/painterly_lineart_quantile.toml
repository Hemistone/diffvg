# Painterly lineart preset using quantile thresholding.
# Uses argparse dest names (underscores), not CLI flag names.

precondition = true
precond_mode = "lineart"
lineart_threshold_mode = "quantile"
lineart_threshold_quantile = 0.2 # Higher -> more ink coverage/paths, lower -> sparser strokes

precond_min_path_length = 8
precond_max_path_length = 256
precond_min_component_area = 0
precond_morph_open_radius = 0
precond_morph_close_radius = 0
stroke_width_mode = "a4_pen"
pen_width_min_mm = 0.35
pen_width_max_mm = 0.8

fixed_stroke = false
fixed_stroke_alpha = 0.94
