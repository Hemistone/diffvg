# Painterly TEED preset for cleaner, fewer edges.
# Uses argparse dest names (underscores), not CLI flag names.

precondition = true
edge_backend = "teed"
teed_weights = "weights/teed/5_model.pth"
teed_detect_res = 768
teed_threshold = 0.35
teed_safe_steps = 2

precond_min_path_length = 12
precond_max_path_length = 256
precond_min_component_area = 32
precond_morph_open_radius = 2
precond_morph_close_radius = 2
precond_base_stroke_width = 0.5
precond_max_stroke_width = 1.0

fixed_stroke = false
fixed_stroke_alpha = 0.9
