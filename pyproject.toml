[build-system]
requires = [
  "setuptools>=68",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "diffvg"
version = "0.2.0"
description = "Stroke-first raster-to-vector engine built around the bezier_gsplat runtime"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{ name = "Tzu-Mao Li et al." }]
keywords = ["graphics", "vector", "rasterizer", "pytorch", "stroke"]
dependencies = [
  "svgpathtools>=1.4",
  "cssutils>=2.2.0",
  "matplotlib>=3.0",
  "cairosvg>=2.8"
]

[project.urls]
Homepage = "https://github.com/Hemistone/diffvg"
Repository = "https://github.com/Hemistone/diffvg"
Issues = "https://github.com/Hemistone/diffvg/issues"

[tool.setuptools.packages.find]
include = ["pydiffvg*"]
